<!-- Social Buttons Start -->

<ul class="list-inline social-buttons">
    {% for network in site.social %}
    <li><a href="{{ network.url }}" target="_blank" rel="noopener noreferrer" aria-label="Follow us on {{ network.title }}"><i class="fa fa-{{ network.title }} fa-fw" aria-hidden="true"></i></a></li>
    {% endfor %}
</ul>

<!-- Social Buttons End -->
